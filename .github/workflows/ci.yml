name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: knowledgehub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d knowledgehub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/knowledgehub_test
      SECRET_KEY: ci-test-secret-key
      OLLAMA_HOST: http://localhost:11434
      LLM_MODEL: mistral:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Enable pgvector
        working-directory: .
        run: |
          docker exec \
            $(docker ps -q --filter ancestor=pgvector/pgvector:pg17) \
            psql -U postgres -d knowledgehub_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      # - name: Install Ollama
      #   working-directory: .
      #   run: |
      #     curl -fsSL https://ollama.com/install.sh | sh

      # - name: Start Ollama
      #   working-directory: .
      #   run: |
      #     ollama serve > /tmp/ollama.log 2>&1 &
      #     sleep 5
      #     curl -f http://localhost:11434/api/tags

      # - name: Pull Mistral
      #   working-directory: .
      #   run: ollama pull mistral:latest

      # - name: Run tests
      #   run: uv run pytest -v 

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/knowledgehub-api:latest
            ghcr.io/${{ github.repository_owner }}/knowledgehub-api:${{ github.sha }}

  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest

    needs:
      - docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            cd ~/knowledgeHub

            git pull origin master

            sed -i "s/^API_IMAGE_TAG=.*/API_IMAGE_TAG=${{ github.sha }}/" deploy/.env.prod

            docker compose \
              --env-file deploy/.env.prod \
              -f docker-compose.prod.yml \
              pull api

            docker compose \
              --env-file deploy/.env.prod \
              -f docker-compose.prod.yml \
              up -d --no-deps api

            echo "Waiting for API..."

            for i in {1..30}; do
              if curl -fsS https://3-24-217-115.sslip.io/api/v1/health; then
                echo "Deployment healthy."
                exit 0
              fi

              echo "API not ready yet ($i/30)"
              sleep 5
            done

            echo "Deployment failed health check."
            docker logs --tail 100 knowledgehub-api
            exit 1
            