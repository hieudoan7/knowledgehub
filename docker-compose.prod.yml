services:
  api:
    image: ghcr.io/hieudoan7/knowledgehub-api:latest
    container_name: knowledgehub-api

    env_file:
      - ./deploy/.env.prod

    volumes:
      - uploads:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    container_name: knowledgehub-postgres

    environment:
      POSTGRES_DB: knowledgehub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d knowledgehub"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: knowledgehub-ollama

    volumes:
      - ollama_data:/root/.ollama

    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
  ollama_data:
