services:
  api:
    image: ghcr.io/hieudoan7/knowledgehub-api:${API_IMAGE_TAG}
    container_name: knowledgehub-api

    env_file:
      - ./backend/.env.production

    ports:
      - "8000:8000"

    volumes:
      - /opt/knowledgehub/certs/global-bundle.pem:/app/certs/global-bundle.pem:ro

    restart: unless-stopped